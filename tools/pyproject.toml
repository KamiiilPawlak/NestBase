[project]
name = "nestbase-tools"
version = "0.1.0"
description = "Warstwa pomocnicza NestBase: generator danych testowych, walidacja, eksport raportów"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.52.0",
    "fpdf2>=2.9.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyodbc>=5.5.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
